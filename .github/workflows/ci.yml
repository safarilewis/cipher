name: CI

on: [push, pull_request]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: adpt
          POSTGRES_PASSWORD: adpt
          POSTGRES_DB: adpt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adpt -d adpt -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd backend
          pip install -e .[dev]
      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -p 5432 -U adpt; do sleep 1; done
      - name: Run migrations
        run: |
          cd backend
          python backend/scripts/apply_migrations.py
        env:
          DATABASE_URL: postgresql+psycopg://adpt:adpt@localhost:5432/adpt
      - name: Run tests
        run: |
          cd backend
          pytest -q
        env:
          DATABASE_URL: postgresql+psycopg://adpt:adpt@localhost:5432/adpt
